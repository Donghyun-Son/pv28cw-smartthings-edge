# 항목과 순서는 공식 Matter 공기질 센서 프로필(aqs-temp-humidity-co2-pm1-pm25-pm10-meas)에 맞추고,
# 이 기기에만 있는 TVOC, 포름알데히드, 배터리를 뒤에 붙인다.
name: pv28cw-air-monitor
components:
  - id: main
    capabilities:
      - id: airQualityHealthConcern
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: carbonDioxideMeasurement
        version: 1
      - id: veryFineDustSensor
        version: 1
      - id: fineDustSensor
        version: 1
      - id: dustSensor
        version: 1
      - id: tvocMeasurement
        version: 1
      - id: formaldehydeMeasurement
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: AirQualityDetector
preferences:
  - name: ipAddress
    title: "IP 주소"
    description: "공유기에서 DHCP 예약으로 고정해 두세요"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: "0.0.0.0"
  - name: deviceId
    title: "Device ID"
    description: "tuyawizard 결과(tuyadevices.json)의 id"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: "-"
  - name: localKey
    title: "Local Key"
    description: "tuyadevices.json의 local_key (16자). 앱에서 센서를 다시 등록하면 바뀝니다"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: "-"
  - name: pollInterval
    title: "조회 주기 (초)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 30
  - name: co2Alarm
    title: "센서 이산화탄소 농도 경보 기준 (ppm)"
    description: "800~2000, 100 단위. 바꿀 때만 센서에 씁니다"
    required: false
    preferenceType: integer
    definition:
      minimum: 800
      maximum: 2000
      default: 1500
  - name: pm25Alarm
    title: "센서 PM 2.5 경보 기준 (μg/m³)"
    description: "15~75, 5 단위. 바꿀 때만 센서에 씁니다"
    required: false
    preferenceType: integer
    definition:
      minimum: 15
      maximum: 75
      default: 75
  - name: alarmSwitch
    title: "센서 경보음"
    required: false
    preferenceType: boolean
    definition:
      default: false
  - name: screenSleep
    title: "센서 화면 자동 꺼짐"
    required: false
    preferenceType: boolean
    definition:
      default: true
