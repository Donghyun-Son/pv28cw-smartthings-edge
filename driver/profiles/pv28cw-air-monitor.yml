# 항목과 순서는 공식 Matter 공기질 센서 프로필(aqs-temp-humidity-co2-pm1-pm25-pm10-meas)에 맞추고,
# 이 기기에만 있는 TVOC, 포름알데히드(HCHO), 배터리를 뒤에 붙인다.
name: pv28cw-air-monitor
components:
  - id: main
    capabilities:
      - id: airQualityHealthConcern
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: carbonDioxideMeasurement
        version: 1
      - id: veryFineDustSensor
        version: 1
      - id: fineDustSensor
        version: 1
      - id: dustSensor
        version: 1
      - id: tvocMeasurement
        version: 1
      - id: formaldehydeMeasurement
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: AirQualityDetector
preferences:
  - name: ipAddress
    title: "IP 주소"
    description: "공유기에서 DHCP 예약으로 고정해 두세요"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: "0.0.0.0"
  - name: localKey
    title: "Local Key"
    description: "tuyadevices.json의 local_key (16자). 앱에서 센서를 다시 등록하면 바뀝니다"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: "-"
  - name: pollInterval
    title: "조회 주기 (초)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 30
  # 센서에는 보정 DP가 없어서 드라이버가 더한다. 표준 tempOffset/humidityOffset preference와 섞이지 않게 이름을 따로 쓴다
  - name: temperatureCorrection
    title: "온도 보정 (°C)"
    description: "센서 온도에 더할 값. 기준 온도계보다 1.5도 높게 나오면 -1.5"
    required: false
    preferenceType: number
    definition:
      minimum: -10
      maximum: 10
      default: 0
  - name: humidityCorrection
    title: "습도 보정 (%p)"
    description: "센서 습도에 더할 값. 기준 습도계보다 5 높게 나오면 -5"
    required: false
    preferenceType: integer
    definition:
      minimum: -20
      maximum: 20
      default: 0
  - name: co2Alarm
    title: "센서 이산화탄소 농도 경보 기준"
    description: "바꿀 때만 센서에 씁니다"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "800": "800 ppm"
        "900": "900 ppm"
        "1000": "1000 ppm"
        "1100": "1100 ppm"
        "1200": "1200 ppm"
        "1300": "1300 ppm"
        "1400": "1400 ppm"
        "1500": "1500 ppm"
        "1600": "1600 ppm"
        "1700": "1700 ppm"
        "1800": "1800 ppm"
        "1900": "1900 ppm"
        "2000": "2000 ppm"
      default: "1500"
  - name: pm25Alarm
    title: "센서 PM 2.5 경보 기준"
    description: "바꿀 때만 센서에 씁니다"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "15": "15 μg/m³"
        "20": "20 μg/m³"
        "25": "25 μg/m³"
        "30": "30 μg/m³"
        "35": "35 μg/m³"
        "40": "40 μg/m³"
        "45": "45 μg/m³"
        "50": "50 μg/m³"
        "55": "55 μg/m³"
        "60": "60 μg/m³"
        "65": "65 μg/m³"
        "70": "70 μg/m³"
        "75": "75 μg/m³"
      default: "75"
  - name: alarmSwitch
    title: "센서 경보음"
    required: false
    preferenceType: boolean
    definition:
      default: false
  - name: screenSleep
    title: "센서 화면 자동 꺼짐"
    required: false
    preferenceType: boolean
    definition:
      default: true
  # 설정 화면에는 버튼이 없어서 스위치로 대신한다. 켜짐/꺼짐과 상관없이 바뀔 때마다 기기를 하나 만든다
  - name: addDevice
    title: "새 기기 추가"
    description: "스위치를 바꿀 때마다(켜짐/꺼짐 상관없음) 설정 전 '공기질 센서'를 하나 만듭니다. 설정 전 기기가 이미 있으면 만들지 않습니다"
    required: false
    preferenceType: boolean
    definition:
      default: false
