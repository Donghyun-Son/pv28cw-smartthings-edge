name: pv28cw-air-monitor
components:
  - id: main
    capabilities:
      - id: airQualityHealthConcern
        version: 1
      - id: carbonDioxideMeasurement
        version: 1
      - id: carbonDioxideHealthConcern
        version: 1
      - id: fineDustSensor
        version: 1
      - id: fineDustHealthConcern
        version: 1
      - id: veryFineDustSensor
        version: 1
      - id: veryFineDustHealthConcern
        version: 1
      - id: dustSensor
        version: 1
      - id: dustHealthConcern
        version: 1
      - id: tvocMeasurement
        version: 1
      - id: tvocHealthConcern
        version: 1
      - id: formaldehydeMeasurement
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: AirQualityDetector
preferences:
  - name: ipAddress
    title: "IP 주소"
    description: "공유기에서 DHCP 예약으로 고정해 두세요"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: "0.0.0.0"
  - name: deviceId
    title: "Device ID"
    description: "tinytuya wizard의 devices.json 'id'"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: "-"
  - name: localKey
    title: "Local Key"
    description: "16자. 기기를 앱에서 다시 등록하면 바뀝니다"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: "-"
  - name: pollInterval
    title: "조회 주기 (초)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 30
  - name: co2Alarm
    title: "기기 CO2 경보 임계값 (ppm)"
    description: "800~2000, 100 단위. 바꿀 때만 기기에 씁니다"
    required: false
    preferenceType: integer
    definition:
      minimum: 800
      maximum: 2000
      default: 1500
  - name: pm25Alarm
    title: "기기 PM2.5 경보 임계값"
    description: "15~75, 5 단위. 바꿀 때만 기기에 씁니다"
    required: false
    preferenceType: integer
    definition:
      minimum: 15
      maximum: 75
      default: 75
  - name: alarmSwitch
    title: "기기 경보음"
    required: false
    preferenceType: boolean
    definition:
      default: false
  - name: screenSleep
    title: "기기 화면 자동 꺼짐"
    required: false
    preferenceType: boolean
    definition:
      default: true
